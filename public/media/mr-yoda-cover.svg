<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 900" width="1320" height="900" role="img">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6b5e"/>
      <stop offset="1" stop-color="#235144"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="lift" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1320" height="900" fill="url(#plate)"/>
  <rect width="1320" height="900" fill="url(#grid)"/>
  <circle cx="1200" cy="130" r="230" fill="#9ff0cf" fill-opacity=".14"/>

  
  <rect x="120" y="118" width="700" height="684" rx="18" fill="#faf8f4" filter="url(#lift)"/>
  <rect x="164" y="166" width="128" height="13" rx="4" fill="#8f8b81"/>

  <!-- answer first -->
  <rect x="164" y="202" width="612" height="116" rx="14" fill="#eaf3ee"/>
  <circle cx="204" cy="248" r="18" fill="#3d6b5e"/>
  <path d="M196 248l6 7 12-14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="238" y="226" width="380" height="16" rx="4" fill="#1b1b17"/>
  <rect x="238" y="256" width="470" height="12" rx="4" fill="#8f8b81"/>
  <rect x="238" y="278" width="320" height="12" rx="4" fill="#8f8b81"/>

  <!-- a value with its typical range -->
  <rect x="164" y="352" width="612" height="1" rx="0" fill="#e3ded4"/>
  <rect x="164" y="382" width="176" height="14" rx="4" fill="#1b1b17"/>
  <rect x="164" y="410" width="96" height="26" rx="13" fill="#e6efe9"/>
  <rect x="600" y="382" width="176" height="14" rx="4" fill="#8f8b81"/>
  <!-- range band, deliberately not drawn like a score -->
  <rect x="164" y="462" width="612" height="12" rx="6" fill="#ece8e0"/>
  <rect x="300" y="462" width="300" height="12" rx="6" fill="#cfe3d8"/>
  <circle cx="392" cy="468" r="13" fill="#3d6b5e"/>
  <rect x="300" y="492" width="66" height="9" rx="4" fill="#8f8b81"/>
  <rect x="546" y="492" width="54" height="9" rx="4" fill="#8f8b81"/>

  <!-- trend -->
  <rect x="164" y="542" width="612" height="1" rx="0" fill="#e3ded4"/>
  <rect x="164" y="570" width="128" height="13" rx="4" fill="#1b1b17"/>
  <polyline points="200,740 292,716 384,730 476,680 568,652 660,606 752,570" fill="none" stroke="#3d6b5e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="740" r="6" fill="#3d6b5e"/><circle cx="292" cy="716" r="6" fill="#3d6b5e"/><circle cx="384" cy="730" r="6" fill="#3d6b5e"/><circle cx="476" cy="680" r="6" fill="#3d6b5e"/><circle cx="568" cy="652" r="6" fill="#3d6b5e"/><circle cx="660" cy="606" r="6" fill="#3d6b5e"/><circle cx="752" cy="570" r="6" fill="#3d6b5e"/>
  <rect x="164" y="762" width="260" height="12" rx="4" fill="#8f8b81"/>

  <!-- next step, tiered -->
  <rect x="860" y="292" width="372" height="330" rx="22" fill="#faf8f4" filter="url(#lift)"/>
  <rect x="900" y="334" width="120" height="12" rx="4" fill="#8f8b81"/>
  <rect x="900" y="366" width="236" height="16" rx="4" fill="#1b1b17"/>
  <rect x="900" y="400" width="292" height="11" rx="4" fill="#8f8b81"/>
  <rect x="900" y="422" width="252" height="11" rx="4" fill="#8f8b81"/>
  <rect x="900" y="462" width="292" height="1" rx="0" fill="#e3ded4"/>
  <rect x="900" y="490" width="292" height="50" rx="25" fill="#3d6b5e"/>
  <rect x="964" y="508" width="164" height="14" rx="4" fill="#ffffff"/>
  <rect x="900" y="556" width="160" height="12" rx="4" fill="#8f8b81"/>

</svg>
