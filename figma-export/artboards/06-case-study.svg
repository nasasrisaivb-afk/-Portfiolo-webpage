<g id="07 User insights">
<rect x="0" y="1828" width="1440" height="900" fill="#efebe3"/>
<line x1="0" y1="1828" x2="1440" y2="1828" stroke="#e4e0d6" stroke-width="1"/>
<text x="96" y="1876" font-family="Inter" font-size="12" font-weight="600" fill="#a8401c" letter-spacing="1.3" id="Number">07</text>
<text x="96" y="1916" font-family="Fraunces" font-size="34" font-weight="600" fill="#14140f" letter-spacing="-1" id="Title">User insights</text>
<g id="Narrative">
<text x="416" y="1876" font-family="Inter" font-size="17" font-weight="400" fill="#56544c" id="line 1">The findings that changed what got built. Each one carries the evidence it came from, because a design</text>
<text x="416" y="1904.9" font-family="Inter" font-size="17" font-weight="400" fill="#56544c" id="line 2">decision defended by an unsourced insight is just an opinion with a diagram.</text>
</g>
<g id="Insight — People do not identify with on">
<rect x="416" y="1996" width="420" height="352" rx="10" fill="#ffffff" stroke="#e4e0d6" stroke-width="1"/>
<text x="436" y="2036" font-family="Inter" font-size="21" font-weight="600" fill="#14140f" letter-spacing="-0.3" id="Title 1">People do not identify with one role</text>
<text x="436" y="2062" font-family="Inter" font-size="21" font-weight="600" fill="#14140f" letter-spacing="-0.3" id="Title 2">— they switch between them by</text>
<text x="436" y="2088" font-family="Inter" font-size="21" font-weight="600" fill="#14140f" letter-spacing="-0.3" id="Title 3">season</text>
<text x="436" y="2122" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 1">Every participant who sold produce also did at least one</text>
<text x="436" y="2143" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 2">other thing on the platform. Asking them to pick an</text>
<text x="436" y="2164" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 3">identity at sign-up was asking them to describe their</text>
<text x="436" y="2185" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 4">March self in August.</text>
<rect x="436" y="2206" width="2" height="84" fill="#a8401c"/>
<text x="452" y="2222" font-family="Fraunces" font-size="21" font-weight="600" fill="#14140f" font-style="italic" id="Quote 1">“In this season I am selling. After</text>
<text x="452" y="2248" font-family="Fraunces" font-size="21" font-weight="600" fill="#14140f" font-style="italic" id="Quote 2">harvest I rent the tractor out. It is</text>
<text x="452" y="2274" font-family="Fraunces" font-size="21" font-weight="600" fill="#14140f" font-style="italic" id="Quote 3">the same me.”</text>
<text x="436" y="2316" font-family="Inter" font-size="11" font-weight="600" fill="#6f6b60" letter-spacing="1.2" id="Evidence">9 / 11 PARTICIPANTS HELD TWO OR MORE ROLES</text>
</g>
<g id="Insight — Ambiguity reads as risk, and r">
<rect x="868" y="1996" width="420" height="224" rx="10" fill="#ffffff" stroke="#e4e0d6" stroke-width="1"/>
<text x="888" y="2036" font-family="Inter" font-size="21" font-weight="600" fill="#14140f" letter-spacing="-0.3" id="Title 1">Ambiguity reads as risk, and risk</text>
<text x="888" y="2062" font-family="Inter" font-size="21" font-weight="600" fill="#14140f" letter-spacing="-0.3" id="Title 2">ends the session</text>
<text x="888" y="2096" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 1">When users could not tell whether a screen was showing</text>
<text x="888" y="2117" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 2">what they could buy or what they were selling, they did</text>
<text x="888" y="2138" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 3">not experiment to find out. They stopped and phoned</text>
<text x="888" y="2159" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 4">someone.</text>
<text x="888" y="2200" font-family="Inter" font-size="11" font-weight="600" fill="#6f6b60" letter-spacing="1.2" id="Evidence">5 / 6 WALKTHROUGHS ABANDONED THE CONSULTANCY TAB WITHIN 20 SECONDS</text>
</g>
<g id="Insight — Trust is built by specifics, n">
<rect x="416" y="2316" width="420" height="300" rx="10" fill="#ffffff" stroke="#e4e0d6" stroke-width="1"/>
<text x="436" y="2356" font-family="Inter" font-size="21" font-weight="600" fill="#14140f" letter-spacing="-0.3" id="Title 1">Trust is built by specifics, not by star</text>
<text x="436" y="2382" font-family="Inter" font-size="21" font-weight="600" fill="#14140f" letter-spacing="-0.3" id="Title 2">ratings</text>
<text x="436" y="2416" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 1">An advisor listing was judged on named credentials,</text>
<text x="436" y="2437" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 2">years of experience and reviews attached to a real</text>
<text x="436" y="2458" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 3">booking. A bare 4.6-star average was dismissed as</text>
<text x="436" y="2479" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 4">something anyone could buy.</text>
<rect x="436" y="2500" width="2" height="58" fill="#a8401c"/>
<text x="452" y="2516" font-family="Fraunces" font-size="21" font-weight="600" fill="#14140f" font-style="italic" id="Quote 1">“Anyone can put five stars. Show</text>
<text x="452" y="2542" font-family="Fraunces" font-size="21" font-weight="600" fill="#14140f" font-style="italic" id="Quote 2">me who he actually helped.”</text>
<text x="436" y="2584" font-family="Inter" font-size="11" font-weight="600" fill="#6f6b60" letter-spacing="1.2" id="Evidence">6 / 6 WALKTHROUGHS ASKED FOR THE ADVISOR’S QUALIFICATION BEFORE PRICE</text>
</g>
<g id="Insight — A price without a date is not ">
<rect x="868" y="2316" width="420" height="198" rx="10" fill="#ffffff" stroke="#e4e0d6" stroke-width="1"/>
<text x="888" y="2356" font-family="Inter" font-size="21" font-weight="600" fill="#14140f" letter-spacing="-0.3" id="Title 1">A price without a date is not an offer</text>
<text x="888" y="2390" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 1">Users would not commit to a service or a rental until they</text>
<text x="888" y="2411" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 2">could see which days it was actually available. Price-first</text>
<text x="888" y="2432" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 3">cards produced enquiries; date-first cards produced</text>
<text x="888" y="2453" font-family="Inter" font-size="14" font-weight="400" fill="#56544c" id="Detail 4">bookings.</text>
<text x="888" y="2494" font-family="Inter" font-size="11" font-weight="600" fill="#6f6b60" letter-spacing="1.2" id="Evidence">RAISED UNPROMPTED IN 8 / 11 INTERVIEWS</text>
</g>
</g>
</g>
</svg>