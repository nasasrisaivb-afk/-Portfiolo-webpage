<text x="1020" y="1582.1" font-family="Inter" font-size="14" font-weight="400" fill="#14140f" id="line 1">Service booking flow</text>
</g>
<g id="Note">
<text x="1020" y="1612.1" font-family="Inter" font-size="11" font-weight="400" fill="#6f6b60" id="line 1">Down from a catalogue with no booking</text>
<text x="1020" y="1626.95" font-family="Inter" font-size="11" font-weight="400" fill="#6f6b60" id="line 2">action at all</text>
</g>
</g>
