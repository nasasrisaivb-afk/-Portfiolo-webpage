<text x="436" y="1762.1" font-family="Inter" font-size="11" font-weight="400" fill="#6f6b60" id="line 1">Contrast, 44px targets and keyboard paths</text>
<text x="436" y="1776.95" font-family="Inter" font-size="11" font-weight="400" fill="#6f6b60" id="line 2">in the token layer</text>
</g>
