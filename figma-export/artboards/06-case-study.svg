<g id="01 Overview">
<line x1="0" y1="1156" x2="1440" y2="1156" stroke="#e4e0d6" stroke-width="1"/>
<text x="96" y="1196" font-family="Inter" font-size="12" font-weight="600" fill="#a8401c" letter-spacing="1.3" id="Number">01</text>
<text x="96" y="1236" font-family="Fraunces" font-size="34" font-weight="600" fill="#14140f" letter-spacing="-1" id="Title">Overview</text>
<g id="Narrative">
<text x="416" y="1196" font-family="Inter" font-size="17" font-weight="400" fill="#56544c" id="line 1">CropVibe is an agricultural marketplace for a market where one person is rarely one kind of user. A farmer</text>
<text x="416" y="1224.9" font-family="Inter" font-size="17" font-weight="400" fill="#56544c" id="line 2">who sells 40 quintals of paddy in March rents out her tractor in May, hires a soil consultant in June and</text>
<text x="416" y="1253.8" font-family="Inter" font-size="17" font-weight="400" fill="#56544c" id="line 3">runs a workshop for neighbours in August. Most agri platforms model those as four different products —</text>
<text x="416" y="1282.7" font-family="Inter" font-size="17" font-weight="400" fill="#56544c" id="line 4">four logins, four apps, four empty inboxes.</text>
</g>
<g id="Narrative 2">
<text x="416" y="1331.6" font-family="Inter" font-size="17" font-weight="400" fill="#56544c" id="line 1">I designed CropVibe around a single account that carries five roles — Seller, Buyer, Rental Provider,</text>
<text x="416" y="1360.5" font-family="Inter" font-size="17" font-weight="400" fill="#56544c" id="line 2">Service Provider and Educator — with the interface reshaping itself around whichever role you are</text>
<text x="416" y="1389.4" font-family="Inter" font-size="17" font-weight="400" fill="#56544c" id="line 3">currently wearing. Phase 1 shipped the web dashboard, the consultancy booking module and an admin</text>
<text x="416" y="1418.3" font-family="Inter" font-size="17" font-weight="400" fill="#56544c" id="line 4">console, on a token-based design system built for one-handed use on a mid-range Android phone in</text>
<text x="416" y="1447.2" font-family="Inter" font-size="17" font-weight="400" fill="#56544c" id="line 5">patchy signal.</text>
</g>
<g id="Metric — Roles on one account">
<rect x="416" y="1508.1" width="272" height="132" rx="10" fill="#ffffff" stroke="#e4e0d6" stroke-width="1"/>
<text x="436" y="1556.1" font-family="Fraunces" font-size="34" font-weight="600" fill="#a8401c" letter-spacing="-1" id="Value">5</text>
<g id="Label">
<text x="436" y="1582.1" font-family="Inter" font-size="14" font-weight="400" fill="#14140f" id="line 1">Roles on one account</text>
</g>
<g id="Note">
<text x="436" y="1612.1" font-family="Inter" font-size="11" font-weight="400" fill="#6f6b60" id="line 1">Seller · Buyer · Rental · Service · Educator</text>
</g>
</g>
