<g id="Label">
<text x="728" y="1582.1" font-family="Inter" font-size="14" font-weight="400" fill="#14140f" id="line 1">Product modules designed</text>
</g>
<g id="Note">
<text x="728" y="1612.1" font-family="Inter" font-size="11" font-weight="400" fill="#6f6b60" id="line 1">Marketplace, rentals, consultancy, courses,</text>
<text x="728" y="1626.95" font-family="Inter" font-size="11" font-weight="400" fill="#6f6b60" id="line 2">orders, intel, admin</text>
</g>
</g>
<g id="Metric — Service booking flow">
